name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '建置設定檔'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview

jobs:
  build:
    name: 雲端建置 Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: StockTracker/package-lock.json

      - name: 安裝依賴套件
        working-directory: StockTracker
        run: npm ci

      - name: 安裝 EAS CLI
        run: npm install -g eas-cli

      - name: 建置 APK
        working-directory: StockTracker
        run: eas build --platform android --profile ${{ github.event.inputs.profile }} --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
