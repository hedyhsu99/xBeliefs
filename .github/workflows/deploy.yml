name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vue-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vue-site

      - name: Copy images to vue-site public
        run: cp -r images vue-site/public/images

      - name: Build Vue site
        run: npm run build
        working-directory: vue-site

      # 合併原始站台 + Vue 站台到同一個輸出目錄
      - name: Assemble _site
        run: |
          mkdir -p _site
          # 原始 HTML 站台：複製根目錄的 HTML、CSS、圖片
          cp index.html mulder.html scully.html profiles.html myCss.css _site/
          cp -r images _site/images
          # Vue 站台：放到 /vue/ 子目錄
          cp -r vue-site/dist _site/vue

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
