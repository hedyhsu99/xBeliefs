name: Deploy Vue Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'vue-site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vue-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vue-site

      - name: Copy images to public
        run: cp -r images vue-site/public/images

      - name: Build
        run: npm run build
        working-directory: vue-site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: vue-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
