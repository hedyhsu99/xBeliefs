<SCRIPT language=JavaScript1.2>   
var kip_time;
var Pre_PhotoNum=1;
var Next_PhotoNum=2;
var end_play=7;
var counter = 0;
var keep_time;
var highlighting;

function highlightit(cur2)
{
 if (cur2.filters.alpha.opacity<100)
     cur2.filters.alpha.opacity+=2;
 else
    clearInterval(highlighting);
}

function change_photo()
{
 if (Next_PhotoNum > end_play)
 {
     Pre_PhotoNum=Next_PhotoNum-1;
     Next_PhotoNum=1;
 }
 Now_Photo=document.all["IMG"+Next_PhotoNum];
 Pre_Photo=document.all["IMG"+Pre_PhotoNum];

 if(form1.photo_desc.disabled)
    form1.photo_desc.disabled=false;

 form1.photo_desc.value = Now_Photo.alt;
// window.status= form1.photo_desc.value;
 
 if (!Now_Photo.complete)
 {
    clearTimeout(keep_time);
    keep_time=setTimeout('change_photo()',100);
 }
 else
 {
    counter++;         
    clearTimeout(keep_time);
    Now_Photo.style.display="inline";
    Pre_Photo.style.display="none";
    keep_time=setTimeout('change_photo()',1000);
    if(counter%parseInt(form1.sec.value)==0)
    {
       counter = 0;
       clearInterval(highlightit);
       Pre_PhotoNum=Next_PhotoNum;
       Pre_Photo.filters.alpha.opacity=0;
       Next_PhotoNum++;
    }
 }
 highlighting=setInterval("highlightit(Now_Photo)",10);
}
</script>
